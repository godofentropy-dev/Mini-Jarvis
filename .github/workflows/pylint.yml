name: Mini-Jarvis Strict Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pylint:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        # Install project dependencies for import checking
        pip install -r requirements.txt || echo "Some deps failed, continuing..."

    - name: Compile Python files
      run: python -m compileall -q .

    - name: Run unit tests
      run: python -m unittest discover -s tests -v

    - name: Run Pylint (static errors)
      run: |
        # Legacy style/complexity warnings remain visible in the report below.
        # Compilation and regression tests are blocking; Pylint blocks on actionable errors.
        pylint **/*.py `
          --errors-only `
          --disable=import-error,no-name-in-module,no-member,c-extension-no-member,unsubscriptable-object,unsupported-assignment-operation,unpacking-non-sequence,not-an-iterable,function-redefined `
          --max-line-length=120 `
          --fail-under=9.0
      shell: pwsh

    - name: Generate Pylint report
      if: always()
      run: |
        pylint **/*.py `
          --disable=missing-docstring,invalid-name,too-many-locals,too-many-arguments,import-error `
          --max-line-length=120 `
          --output-format=text:pylint-report.txt || true
      shell: pwsh

    - name: Upload Pylint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pylint-report
        path: pylint-report.txt
